services:
  - type: web
    name: skilltwin-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm@9.15.4 && pnpm install --frozen-lockfile && pnpm --filter @skilltwin/contracts build && pnpm --filter @skilltwin/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: EMAIL_FROM
        value: SkillTwin <noreply@skilltwin.dev>
