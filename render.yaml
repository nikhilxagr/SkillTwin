services:
  - type: web
    name: skilltwin-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npx --yes pnpm@9.15.4 install --frozen-lockfile && npx --yes pnpm@9.15.4 --filter @skilltwin/contracts build && npx --yes pnpm@9.15.4 --filter @skilltwin/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEB_ORIGIN
        value: https://yourskilltwin.vercel.app
      - key: API_BASE_URL
        value: https://skilltwin-api-hafc.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: EMAIL_FROM
        value: SkillTwin <noreply@skilltwin.dev>
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        value: nikhilagrahari517@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://skilltwin-api-hafc.onrender.com/api/auth/google/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: https://skilltwin-api-hafc.onrender.com/api/auth/github/callback
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CALLBACK_URL
        value: https://skilltwin-api-hafc.onrender.com/api/auth/linkedin/callback
